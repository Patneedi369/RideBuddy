version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ridebuddy_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ridebuddy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: ridebuddy_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/ridebuddy
      - SECRET_KEY=ridebuddy_super_secret_jwt_key_2026_india
    depends_on:
      - db

volumes:
  postgres_data:
